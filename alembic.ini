# Alembic configuration file, generated for rag-project.

[alembic]
script_location = src/db/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://rag:rag@localhost:5432/rag

[post_write_hooks]
# Log output to console (uncomment to enable)
# hooks = console_logs
# console_logs = %(here)s/scripts/log.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S