[project]
name = "rag-project"
version = "0.0.5"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
